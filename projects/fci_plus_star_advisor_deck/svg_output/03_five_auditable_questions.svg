    <text x="205" y="264" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#2F6BFF">TRACEABILITY</text>
    <text x="205" y="297" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#1A2433">Where is each paper stage implemented and tested?</text>
    <circle cx="150" cy="364" r="30" fill="#E58A2B"/>
    <text x="150" y="374" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="24" font-weight="700" fill="#FFFFFF">3</text>
    <text x="205" y="356" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#E58A2B">KNOWN TRUTH</text>
    <text x="205" y="389" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#1A2433">What happens when the correct graph is known?</text>
