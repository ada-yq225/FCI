    <text x="150" y="466" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="24" font-weight="700" fill="#FFFFFF">4</text>
    <text x="205" y="448" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#7562A8">SOFTWARE</text>
    <text x="205" y="481" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#1A2433">Which comparisons across implementations are fair?</text>
    <circle cx="150" cy="548" r="30" fill="#1C9A8A"/>
    <text x="150" y="558" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="24" font-weight="700" fill="#FFFFFF">5</text>
    <text x="205" y="540" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1C9A8A">APPLICATION</text>
    <text x="205" y="573" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#1A2433">Which STAR findings are randomized, stable, or exploratory?</text>
