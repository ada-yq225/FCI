  <g id="sequence-claim-03" data-pptx-bounds="56 603 1168 46">
    <text x="56" y="623" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#183153">Source fidelity → validation → application interpretation.<tspan x="56" dy="27">An attractive real-data graph cannot reverse this order.</tspan></text>
