    <text x="150" y="190" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="24" font-weight="700" fill="#FFFFFF">1</text>
    <text x="205" y="172" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#2F6BFF">THEORY</text>
    <text x="205" y="205" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#1A2433">What do the two original sources actually assume and prove?</text>
