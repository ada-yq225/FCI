<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <defs>
    <marker id="arrow-05" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#183153"/></marker>
  </defs>
  <rect id="page-background-05" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#F7F5EF"/>
  <g id="header-05" data-pptx-bounds="56 36 1168 86">
    <text x="56" y="74" font-family="Georgia, Times New Roman, serif" font-size="42" font-weight="700" fill="#183153">FCI+ Uses a Sparse Logical Characterization</text>
    <text x="1224" y="57" text-anchor="end" font-family="Consolas, Courier New, monospace" font-size="18" fill="#E58A2B">CLAASSEN ET AL. 2013</text>
    <line x1="56" y1="106" x2="1224" y2="106" stroke="#CBD2DC" stroke-width="1.5"/>
  </g>
  <g id="fci-plus-flow-05" data-pptx-bounds="56 140 800 406">
    <text x="56" y="164" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#E58A2B">ALGORITHM 2: FROM LOCAL SKELETON TO D-SEP LINK REMOVAL</text>
    <rect x="56" y="183" width="326" height="143" rx="14" fill="#FFFFFF" stroke="#E58A2B" stroke-width="2"/>
    <text x="82" y="217" font-family="Consolas, Courier New, monospace" font-size="20" font-weight="700" fill="#E58A2B">01  PC skeleton</text>
    <text x="82" y="255" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#1A2433">Bound local CI search by k</text>
    <text x="82" y="294" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#5F6875">Start sparse; store separating sets.</text>
    <line x1="382" y1="249" x2="430" y2="249" stroke="#183153" stroke-width="2.5" marker-end="url(#arrow-05)"/>
    <rect x="440" y="183" width="386" height="143" rx="14" fill="#FFF3E3" stroke="#E58A2B" stroke-width="3"/>
    <text x="466" y="217" font-family="Consolas, Courier New, monospace" font-size="20" font-weight="700" fill="#E58A2B">02  Augmented skeleton</text>
    <text x="466" y="250" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#1A2433">Temporary arrowheads<tspan x="466" dy="27">encode dependence</tspan></text>
    <text x="466" y="310" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5F6875">Recognize candidate D-SEP-link witnesses.</text>
    <line x1="633" y1="326" x2="633" y2="342" stroke="#183153" stroke-width="2.5" marker-end="url(#arrow-05)"/>
    <rect x="440" y="342" width="386" height="176" rx="14" fill="#FFFFFF" stroke="#E58A2B" stroke-width="2"/>
    <text x="466" y="376" font-family="Consolas, Courier New, monospace" font-size="20" font-weight="700" fill="#E58A2B">03  Recursive hierarchy</text>
    <text x="466" y="411" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#1A2433">Construct a targeted<tspan x="466" dy="27">separator basis</tspan></text>
    <text x="466" y="474" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5F6875">Use known sepsets and collider structure<tspan x="466" dy="22">instead of broad Possible-D-SEP enumeration.</tspan></text>
    <line x1="440" y1="430" x2="392" y2="430" stroke="#183153" stroke-width="2.5" marker-end="url(#arrow-05)"/>
    <rect x="56" y="342" width="326" height="176" rx="14" fill="#183153"/>
    <text x="82" y="376" font-family="Consolas, Courier New, monospace" font-size="20" font-weight="700" fill="#FFC77E">04  Test → minimize → revisit</text>
    <text x="82" y="413" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">Remove a verified<tspan x="82" dy="27">D-SEP link</tspan></text>
    <text x="82" y="476" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#E9EDF5">Update candidates; then orient<tspan x="82" dy="22">the verified final skeleton.</tspan></text>
  </g>
  <g id="witness-05" data-pptx-bounds="56 558 1168 70">
    <text x="56" y="584" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#5F6875">D-SEP WITNESS</text>
    <text x="238" y="590" font-family="Consolas, Courier New, monospace" font-size="24" font-weight="700" fill="#E58A2B">U ↔ X ↔ Y ↔ V</text>
    <text x="468" y="590" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#1A2433">+ hierarchy-derived separating information</text>
  </g>
  <g id="complexity-05" data-pptx-bounds="890 140 334 406">
    <rect x="890" y="140" width="334" height="406" rx="16" fill="#183153"/>
    <text x="920" y="177" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#FFC77E">CONDITIONAL QUERY BOUND</text>
    <text x="1057" y="258" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="34" font-weight="700" fill="#FFFFFF">O(N^(2(k+2)))</text>
    <line x1="920" y1="294" x2="1194" y2="294" stroke="#5C7190" stroke-width="1.5"/>
    <text x="920" y="332" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">Only under:</text>
    <text x="920" y="371" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#E9EDF5">• fixed observed-MAG degree k<tspan x="920" dy="32">• Faithfulness</tspan><tspan x="920" dy="32">• constant-time exact CI oracle</tspan></text>
    <rect x="920" y="461" width="274" height="54" rx="10" fill="#B45F4A"/>
    <text x="1057" y="483" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">NOT a sample-accuracy guarantee<tspan x="1057" dy="22">NOT a wall-clock guarantee</tspan></text>
  </g>
  <g id="footer-05" data-pptx-bounds="56 640 1168 48">
    <text x="56" y="665" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5F6875">Claassen, Mooij &amp; Heskes (2013), Def. 3, Lemmas 4–7, Algorithm 2 p. 178, complexity p. 179 · supplement theorem/body</text>
    <text x="1224" y="665" text-anchor="end" font-family="Consolas, Courier New, monospace" font-size="16" fill="#5F6875">05 / 15</text>
  </g>
</svg>
