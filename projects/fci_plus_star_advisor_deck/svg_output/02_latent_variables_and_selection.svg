  <g id="causal-system-02" data-pptx-bounds="56 142 640 410">
    <text x="56" y="164" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#5F6875">UNDERLYING CAUSAL SYSTEM</text>
    <circle cx="207" cy="245" r="38" fill="#E9EDF5" stroke="#7562A8" stroke-width="3" stroke-dasharray="7 6"/>
    <text x="207" y="253" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="30" font-weight="700" fill="#7562A8">U</text>
    <text x="207" y="300" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#5F6875">unobserved</text>
    <circle cx="98" cy="388" r="45" fill="#FFFFFF" stroke="#2F6BFF" stroke-width="3"/>
    <text x="98" y="396" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#183153">X</text>
    <circle cx="316" cy="388" r="45" fill="#FFFFFF" stroke="#2F6BFF" stroke-width="3"/>
    <text x="316" y="396" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#183153">Y</text>
    <circle cx="520" cy="388" r="45" fill="#FFF7ED" stroke="#B45F4A" stroke-width="3"/>
    <text x="520" y="396" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#183153">S</text>
    <text x="520" y="455" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#B45F4A">conditioned selection</text>
    <line x1="183" y1="275" x2="125" y2="347" stroke="#7562A8" stroke-width="3" marker-end="url(#arrow-purple-02)"/>
    <line x1="231" y1="275" x2="289" y2="347" stroke="#7562A8" stroke-width="3" marker-end="url(#arrow-purple-02)"/>
    <line x1="139" y1="388" x2="469" y2="388" stroke="#B45F4A" stroke-width="3" marker-end="url(#arrow-red-02)"/>
    <line x1="361" y1="374" x2="472" y2="356" stroke="#B45F4A" stroke-width="3" marker-end="url(#arrow-red-02)"/>
    <text x="56" y="505" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#1A2433">Marginalizing U and conditioning on S can induce a<tspan x="56" dy="28">mixed ancestral relation among observed variables.</tspan></text>
