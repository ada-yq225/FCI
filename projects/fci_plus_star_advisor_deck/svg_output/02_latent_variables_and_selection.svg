    <text x="929" y="410" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#FFFFFF">bidirected</text>
    <text x="746" y="463" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#E9EDF5">Adjacency ≠ direct effect<tspan x="746" dy="26">Circle = unresolved endpoint</tspan><tspan x="746" dy="26">Sample CI test ≠ exact oracle</tspan></text>
  </g>
  <g id="claim-02" data-pptx-bounds="56 558 1168 76">
    <rect x="56" y="558" width="1168" height="76" rx="12" fill="#E9EDF5"/>
    <text x="80" y="585" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#183153">The graph records invariant ancestral constraints—<tspan x="80" dy="31">and preserves uncertainty where the data cannot decide.</tspan></text>
