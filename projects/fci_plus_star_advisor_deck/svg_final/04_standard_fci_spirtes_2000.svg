    <text x="84" y="493" font-family="Georgia, Times New Roman, serif" font-size="30" font-weight="700" fill="#FFFFFF">Every intermediate triple is either</text>
    <text x="84" y="536" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#FFFFFF">a collider on the current path, or part of a triangle.</text>
    <text x="84" y="566" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#E9EDF5">This computable superset makes non-local separator search possible.</text>
